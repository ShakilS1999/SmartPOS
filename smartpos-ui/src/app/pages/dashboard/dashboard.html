<h2>Dashboard</h2>

<div *ngIf="data">

  <div style="display:flex; gap:20px; margin-top:20px;">

    <!-- Total Products -->
    <div style="border:1px solid #ccc; padding:20px; width:200px;">
      <h3>Total Products</h3>
      <h1>{{data.totalProducts}}</h1>
    </div>

    <!-- Total Sales -->
    <div style="border:1px solid #ccc; padding:20px; width:200px;">
      <h3>Total Sales</h3>
      <h1>{{data.totalSales}}</h1>
    </div>

    <!-- Total Revenue -->
    <div style="border:1px solid #ccc; padding:20px; width:200px;">
      <h3>Total Revenue</h3>
      <h1>{{data.totalRevenue}}</h1>
    </div>

  </div>

</div>
