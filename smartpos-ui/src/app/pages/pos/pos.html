<h2>POS System</h2>

<div style="display:flex; gap:20px">

  <!-- Product List -->
  <div style="width:50%">
    <h3>Products</h3>

    <div *ngFor="let p of products" style="margin-bottom:10px">
      {{p.productName}} - {{p.price}}
      <button (click)="addToCart(p)">Add</button>
    </div>
  </div>

  <!-- Cart -->
  <div style="width:50%">
    <h3>Cart</h3>

    <table border="1" width="100%">
      <thead>
        <tr>
          <th>Name</th>
          <th>Qty</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let c of cart; let i = index">
          <td>{{c.productName}}</td>

          <td>
            <input type="number"
                   [(ngModel)]="c.quantity"
                   (change)="updateTotal()"
                   min="1" />
          </td>

          <td>{{c.totalPrice}}</td>

          <td>
            <button (click)="removeItem(i)">❌</button>
          </td>
        </tr>
      </tbody>
    </table>

    <h3>Total: {{grandTotal}}</h3>

    <button (click)="checkout()">Checkout</button>
  </div>

</div>

<hr>

<!-- 🧾 Invoice Section -->
<div *ngIf="showInvoice">

  <div id="invoice" style="padding:20px">

    <h2>SmartPOS</h2>
    <p>Date: {{today}}</p>

    <table border="1" width="100%">
      <thead>
        <tr>
          <th>Name</th>
          <th>Qty</th>
          <th>Total</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let c of invoiceItems">
          <td>{{c.productName}}</td>
          <td>{{c.quantity}}</td>
          <td>{{c.totalPrice}}</td>
        </tr>
      </tbody>
    </table>

    <h3>Grand Total: {{grandTotal}}</h3>

  </div>

  <br>

  <button (click)="printInvoice()">🖨️ Print</button>

</div>
