<div class="suppliers">

  <h1>Suppliers</h1>

  <div class="form-section">

    <h2>{{ isEditing ? 'Edit Supplier' : 'Add Supplier' }}</h2>

    <div class="form-row">
      <div class="form-group">
        <label>Supplier Name</label>
        <input type="text" [(ngModel)]="supplierName" placeholder="Enter name" />
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" [(ngModel)]="phone" placeholder="Enter phone" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" placeholder="Enter email" />
      </div>
      <div class="form-group">
        <label>Address</label>
        <input type="text" [(ngModel)]="address" placeholder="Enter address" />
      </div>
    </div>

    <button (click)="saveSupplier()">
      {{ isEditing ? 'Update Supplier' : 'Add Supplier' }}
    </button>

    @if (isEditing) {
      <button class="cancel-btn" (click)="cancelEdit()">Cancel</button>
    }

  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Address</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      @for (supplier of suppliers(); track supplier.supplierId) {
        <tr>
          <td>{{ supplier.supplierId }}</td>
          <td>{{ supplier.supplierName }}</td>
          <td>{{ supplier.phone }}</td>
          <td>{{ supplier.email }}</td>
          <td>{{ supplier.address }}</td>
          <td>
            <button (click)="editSupplier(supplier)">Edit</button>
            <button class="delete-btn" (click)="deleteSupplier(supplier.supplierId)">Delete</button>
          </td>
        </tr>
      }
    </tbody>
  </table>

</div>
