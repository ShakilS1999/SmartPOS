<div class="edit-product">

  <h1>Edit Product</h1>

  <div>

    <label>Product Name</label>

    <input
      type="text"
      [(ngModel)]="productName"
    />

  </div>

  <div>

    <label>Barcode</label>

    <input
      type="text"
      [(ngModel)]="barcode"
    />

  </div>

  <div>

    <label>Selling Price</label>

    <input
      type="number"
      [(ngModel)]="price"
    />

  </div>

  <div>

    <label>Cost Price</label>

    <input
      type="number"
      [(ngModel)]="costPrice"
    />

  </div>

  <div>

    <label>Stock Quantity</label>

    <input
      type="number"
      [(ngModel)]="stockQuantity"
    />

  </div>

  <button (click)="updateProduct()">
    Update Product
  </button>

</div>
