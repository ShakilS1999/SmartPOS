<div class="users">

  <h1>User Management</h1>

  <div class="form-section">

    <h2>Add New User</h2>

    <div class="form-group">
      <label>Username</label>
      <input type="text" [(ngModel)]="username" placeholder="Enter username" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="Enter password" />
    </div>

    <div class="form-group">
      <label>Role</label>
      <select [(ngModel)]="role">
        <option value="Admin">Admin</option>
        <option value="Cashier">Cashier</option>
      </select>
    </div>

    <button (click)="createUser()">Add User</button>

  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Role</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      @for (user of users(); track user.userId) {
        <tr>
          <td>{{ user.userId }}</td>
          <td>{{ user.username }}</td>
          <td>
            <span [class]="user.role === 'Admin' ? 'badge-admin' : 'badge-cashier'">
              {{ user.role }}
            </span>
          </td>
          <td>
            <button class="delete-btn" (click)="deleteUser(user.userId)">
              Delete
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>

</div>
